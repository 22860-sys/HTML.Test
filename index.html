<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิดเลข</title>
    <!-- เรียกใช้ Tailwind CSS เพื่อความสวยงามและ Responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* เพิ่ม Effect ตอนกดปุ่มให้ดูสมจริงขึ้น */
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen flex items-center justify-center p-4">

    <!-- กรอบเครื่องคิดเลข -->
    <div class="bg-gray-900 border border-gray-700 rounded-[2.5rem] shadow-2xl w-full max-w-sm overflow-hidden p-6 relative">
        
        <!-- ส่วนหน้าจอแสดงผล (Display) -->
        <div class="flex flex-col items-end justify-end h-32 mb-6 w-full px-2">
            <!-- แสดงตัวเลขและเครื่องหมายก่อนหน้า -->
            <div id="prevDisplay" class="text-gray-400 text-lg h-6 mb-1 tracking-wider overflow-hidden whitespace-nowrap w-full text-right"></div>
            <!-- แสดงตัวเลขปัจจุบัน -->
            <div id="display" class="text-white text-5xl font-light tracking-tight overflow-hidden whitespace-nowrap w-full text-right" style="direction: ltr;">0</div>
        </div>

        <!-- แผงปุ่มกด (Keypad) -->
        <div class="grid grid-cols-4 gap-3">
            <!-- แถวที่ 1 -->
            <button onclick="clearDisplay()" class="btn-press col-span-2 bg-gray-300 hover:bg-gray-200 text-gray-900 font-semibold rounded-full h-16 text-xl transition-colors">AC</button>
            <button onclick="deleteNumber()" class="btn-press bg-gray-300 hover:bg-gray-200 text-gray-900 font-semibold rounded-full h-16 text-xl transition-colors flex justify-center items-center">
                <!-- ไอคอนลบตัวหลังสุด -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                </svg>
            </button>
            <button onclick="chooseOperator('÷')" class="btn-press bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-full h-16 text-2xl transition-colors">÷</button>

            <!-- แถวที่ 2 -->
            <button onclick="appendNumber('7')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">7</button>
            <button onclick="appendNumber('8')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">8</button>
            <button onclick="appendNumber('9')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">9</button>
            <button onclick="chooseOperator('×')" class="btn-press bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-full h-16 text-2xl transition-colors">×</button>

            <!-- แถวที่ 3 -->
            <button onclick="appendNumber('4')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">4</button>
            <button onclick="appendNumber('5')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">5</button>
            <button onclick="appendNumber('6')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">6</button>
            <button onclick="chooseOperator('-')" class="btn-press bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-full h-16 text-3xl pb-1 transition-colors">-</button>

            <!-- แถวที่ 4 -->
            <button onclick="appendNumber('1')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">1</button>
            <button onclick="appendNumber('2')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">2</button>
            <button onclick="appendNumber('3')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl transition-colors">3</button>
            <button onclick="chooseOperator('+')" class="btn-press bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-full h-16 text-2xl transition-colors">+</button>

            <!-- แถวที่ 5 -->
            <button onclick="appendNumber('0')" class="btn-press col-span-2 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-2xl text-left pl-8 transition-colors">0</button>
            <button onclick="appendNumber('.')" class="btn-press bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-full h-16 text-3xl pb-2 transition-colors">.</button>
            <button onclick="calculate()" class="btn-press bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-full h-16 text-3xl transition-colors">=</button>
        </div>
    </div>

    <!-- โค้ด JavaScript สำหรับระบบคำนวณ -->
    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;

        const displayEl = document.getElementById('display');
        const prevDisplayEl = document.getElementById('prevDisplay');

        // ฟังก์ชันอัปเดตหน้าจอ
        function updateDisplay() {
            // ปรับขนาดตัวอักษรหากตัวเลขยาวเกินไป (แบบจำลองง่ายๆ)
            if (currentInput.length > 9) {
                displayEl.classList.remove('text-5xl');
                displayEl.classList.add('text-3xl');
            } else {
                displayEl.classList.add('text-5xl');
                displayEl.classList.remove('text-3xl');
            }

            displayEl.innerText = formatNumber(currentInput);
            
            if (operator != null) {
                prevDisplayEl.innerText = `${formatNumber(previousInput)} ${operator}`;
            } else {
                prevDisplayEl.innerText = '';
            }
        }

        // ทำให้มีลูกน้ำ (,) คั่นหลักพัน
        function formatNumber(numStr) {
            if (numStr === '-' || numStr === 'Error') return numStr;
            const parts = numStr.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        // ฟังก์ชันล้างค่าทั้งหมด (ปุ่ม AC)
        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            updateDisplay();
        }

        // ฟังก์ชันลบตัวเลขตัวหลังสุด
        function deleteNumber() {
            if (shouldResetScreen || currentInput === 'Error') {
                currentInput = '0';
                shouldResetScreen = false;
            } else {
                currentInput = currentInput.slice(0, -1);
                if (currentInput === '' || currentInput === '-') {
                    currentInput = '0';
                }
            }
            updateDisplay();
        }

        // ฟังก์ชันกดปุ่มตัวเลข
        function appendNumber(number) {
            if (currentInput === 'Error') clearDisplay();
            
            if (shouldResetScreen) {
                currentInput = '';
                shouldResetScreen = false;
            }
            
            // ป้องกันการกดจุดซ้ำ
            if (number === '.' && currentInput.includes('.')) return;
            
            // จำกัดจำนวนหลักเพื่อไม่ให้ล้นจอ
            if (currentInput.replace('.', '').length >= 12) return;

            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        // ฟังก์ชันเลือกเครื่องหมาย (+, -, ×, ÷)
        function chooseOperator(op) {
            if (currentInput === 'Error') clearDisplay();
            if (currentInput === '' && previousInput === '') return;
            
            // ถ้ามี operator อยู่แล้ว และผู้ใช้กดเปลี่ยน operator โดยยังไม่ใส่ตัวเลขใหม่
            if (currentInput === '') {
                operator = op;
                updateDisplay();
                return;
            }
            
            if (previousInput !== '') {
                calculate();
            }
            
            operator = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        // ฟังก์ชันคำนวณผลลัพธ์ (ปุ่ม =)
        function calculate() {
            if (operator === null || currentInput === '' || shouldResetScreen) return;
            
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            switch (operator) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '×': computation = prev * current; break;
                case '÷':
                    if (current === 0) {
                        // ป้องกันการหารด้วยศูนย์
                        currentInput = 'Error';
                        operator = null;
                        previousInput = '';
                        updateDisplay();
                        shouldResetScreen = true;
                        return;
                    }
                    computation = prev / current;
                    break;
                default: return;
            }
            
            // จำกัดจำนวนทศนิยมเพื่อความสวยงาม
            computation = Math.round(computation * 100000000) / 100000000;
            
            currentInput = computation.toString();
            operator = null;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        // เพิ่มการรองรับการกดคีย์บอร์ด
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9' || e.key === '.') appendNumber(e.key);
            if (e.key === '+' || e.key === '-') chooseOperator(e.key);
            if (e.key === '*') chooseOperator('×');
            if (e.key === '/') chooseOperator('÷');
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            if (e.key === 'Backspace') deleteNumber();
            if (e.key === 'Escape') clearDisplay();
        });

    </script>
</body>
</html>
